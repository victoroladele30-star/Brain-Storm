---
# On-Call Alerting Rules
# Routes critical platform alerts to PagerDuty on-call rotation.
# Runbook: https://github.com/BrainTease/Brain-Storm/blob/main/docs/incident-runbook.md

groups:
  - name: oncall_escalation
    interval: 60s
    rules:
      # Synthetic metric: 1 when any critical alert is firing, 0 otherwise.
      # Used by Grafana dashboards to show on-call status at a glance.
      - record: oncall:critical_alerts_firing
        expr: count(ALERTS{severity="critical", alertstate="firing"}) or vector(0)

      # Composite "platform health" score (1 = healthy, 0 = degraded).
      # Drops to 0 when any critical alert fires.
      - record: oncall:platform_health_score
        expr: |
          clamp_max(
            1 - clamp_max(count(ALERTS{severity="critical", alertstate="firing"}) or vector(0), 1),
            1
          )

  - name: simulated_incidents
    interval: 30s
    rules:
      # Simulated incident test alert — fire this in staging to verify routing.
      # To trigger: set the metric brain_storm_test_incident_active to 1 in staging.
      - alert: SimulatedIncidentTest
        expr: brain_storm_test_incident_active{env="staging"} == 1
        for: 1m
        labels:
          severity: critical
          team: backend
          oncall: 'true'
          env: staging
        annotations:
          summary: '🧪 Simulated incident test — verify PagerDuty routing'
          description: >
            This is a synthetic alert used to verify that on-call routing and
            PagerDuty escalation are working correctly. If you received this page
            outside of a planned test, investigate immediately.
          runbook_url: 'https://github.com/BrainTease/Brain-Storm/blob/main/docs/incident-runbook.md'
