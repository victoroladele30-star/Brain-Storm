name: DAST — OWASP ZAP Dynamic Scan

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday 06:00 UTC
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: true
        default: 'https://staging.brainstorm.app'

permissions:
  contents: read
  security-events: write
  actions: read

env:
  ZAP_TARGET: ${{ github.event.inputs.target_url || 'https://staging.brainstorm.app' }}
  ZAP_REPORT_DIR: zap-reports
  MAX_HIGH_ALERTS: 0

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: '${{ env.ZAP_TARGET }}'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -I'
          allow_issue_writing: false
          fail_action: true

      - name: Upload ZAP HTML report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: zap-baseline-report
          path: report_html.html
          retention-days: 30

      - name: Upload ZAP JSON report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: zap-baseline-json
          path: report_json.json
          retention-days: 30

      - name: Check for new HIGH severity findings
        run: |
          if [ -f report_json.json ]; then
            HIGH_COUNT=$(jq '[.site[].alerts[] | select(.riskcode == "2" or .riskcode == "3")] | length' report_json.json 2>/dev/null || echo 0)
            echo "High/Critical severity findings: $HIGH_COUNT"
            if [ "$HIGH_COUNT" -gt "${{ env.MAX_HIGH_ALERTS }}" ]; then
              echo "❌ High-severity findings detected — blocking merge."
              echo "Review the full report in workflow artifacts: zap-baseline-report"
              exit 1
            fi
          fi
          echo "✅ No high-severity findings above threshold."

      - name: Post ZAP summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## DAST Scan Results\n\n';
            try {
              const json = JSON.parse(fs.readFileSync('report_json.json', 'utf8'));
              const alerts = [];
              for (const site of (json.site || [])) {
                for (const alert of (site.alerts || [])) {
                  alerts.push(alert);
                }
              }
              if (alerts.length === 0) {
                summary += '✅ No vulnerabilities detected.\n';
              } else {
                summary += '| Severity | Count |\n|----------|-------|\n';
                const counts = { '3': 0, '2': 0, '1': 0, '0': 0 };
                alerts.forEach(a => counts[a.riskcode] = (counts[a.riskcode] || 0) + 1);
                summary += `| Critical | ${counts['3']} |\n`;
                summary += `| High | ${counts['2']} |\n`;
                summary += `| Medium | ${counts['1']} |\n`;
                summary += `| Low | ${counts['0']} |\n`;
              }
            } catch {
              summary += '⚠️ Could not parse ZAP report.\n';
            }
            summary += '\n📊 [Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  zap-full-scan:
    name: ZAP Full Scan (Weekly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run ZAP full scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: '${{ env.ZAP_TARGET }}'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -I -T 30'
          allow_issue_writing: false
          fail_action: true

      - name: Upload ZAP HTML report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: zap-full-scan-report
          path: report_html.html
          retention-days: 90

      - name: Upload ZAP JSON report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: zap-full-scan-json
          path: report_json.json
          retention-days: 90

      - name: Upload ZAP config and rules as artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: zap-config
          path: |
            .zap/rules.tsv
            .zap/zap-config.yml
          retention-days: 90

      - name: Check for new HIGH severity findings
        run: |
          if [ -f report_json.json ]; then
            HIGH_COUNT=$(jq '[.site[].alerts[] | select(.riskcode == "2" or .riskcode == "3")] | length' report_json.json 2>/dev/null || echo 0)
            echo "High/Critical severity findings: $HIGH_COUNT"
            if [ "$HIGH_COUNT" -gt "${{ env.MAX_HIGH_ALERTS }}" ]; then
              echo "❌ High-severity findings detected. Create a GitHub issue."
              gh issue create \
                --title "DAST: High-severity findings in weekly scan" \
                --body "OWASP ZAP full scan detected $HIGH_COUNT high/critical severity findings.\n\nReport: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                --label "security,dast,automated-scan" \
                --repo ${{ github.repository }} || true
              exit 1
            fi
          fi
          echo "✅ No high-severity findings above threshold."

  zap-scan-gate:
    name: ZAP Security Gate
    runs-on: ubuntu-latest
    needs: [zap-baseline, zap-full-scan]
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          echo "## ZAP Scan Security Gate" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.zap-baseline.result }}" == "failure" ] || [ "${{ needs.zap-full-scan.result }}" == "failure" ]; then
            echo "❌ ZAP scan failed — review reports before proceeding." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ All ZAP scans passed." >> $GITHUB_STEP_SUMMARY
