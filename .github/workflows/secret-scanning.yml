name: Secret Scanning

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

# Block merges if secrets are detected
permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks — Detect Leaked Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Gitleaks can scan all commits in the push/PR
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the workflow (exit 1) if leaks are found
          GITLEAKS_ENABLE_COMMENTS: 'true'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  trufflehog:
    name: TruffleHog — High-Entropy Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  dotenv-guard:
    name: Block .env Files from Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no real .env files are committed
        run: |
          # Allow .env.example but block actual .env / .env.local / .env.production etc.
          FOUND=$(git ls-files | grep -E '(^|/)\.(env)(\.[^e][^x][^a][^m][^p][^l][^e].*)?$' || true)
          if [ -n "$FOUND" ]; then
            echo "❌ Real .env file(s) committed to the repository:"
            echo "$FOUND"
            echo ""
            echo "Store secrets in AWS Secrets Manager. See docs/secret-management.md"
            exit 1
          fi
          echo "✅ No .env files found in repository"

      - name: Scan for hardcoded secrets patterns
        run: |
          PATTERNS=(
            'password\s*=\s*["\x27][^"\x27]{8,}'
            'secret\s*=\s*["\x27][^"\x27]{16,}'
            'api_key\s*=\s*["\x27][^"\x27]{16,}'
            'STELLAR_SECRET_KEY\s*=\s*S[A-Z2-7]{55}'
            'jwt_secret\s*=\s*["\x27][^"\x27]{16,}'
          )
          FAIL=false
          for pattern in "${PATTERNS[@]}"; do
            # Exclude example files, tests, and docs
            MATCHES=$(grep -rniE "$pattern" \
              --include="*.ts" --include="*.js" --include="*.json" --include="*.yml" --include="*.yaml" \
              --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir="dist" \
              --exclude="*.example*" --exclude="*.spec.*" --exclude="*.test.*" \
              . 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️  Potential hardcoded secret matching pattern '$pattern':"
              echo "$MATCHES"
              FAIL=true
            fi
          done
          if $FAIL; then
            echo ""
            echo "Remove hardcoded secrets and use AWS Secrets Manager. See docs/secret-management.md"
            exit 1
          fi
          echo "✅ No hardcoded secret patterns detected"

  notify-on-leak:
    name: Notify Security Team on Leak Detection
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog, dotenv-guard]
    if: failure()
    steps:
      - name: Alert security team via Slack
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "🚨 *Secret Leak Detected* in `${{ github.repository }}` by `${{ github.actor }}`\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nReview and rotate any exposed credentials immediately."
            }' || true
