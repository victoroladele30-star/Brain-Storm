name: Supply-Chain Security & Dependency Scanning

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  NODE_AUDIT_LEVEL: high
  CARGO_AUDIT_LEVEL: warn
  SECRET_SCAN_SEVERITY: high

jobs:
  npm-audit:
    name: npm audit (workspaces)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit backend (high severity gate)
        run: npm audit --workspace=apps/backend --audit-level=${{ env.NODE_AUDIT_LEVEL }}

      - name: Audit frontend (high severity gate)
        run: npm audit --workspace=apps/frontend --audit-level=${{ env.NODE_AUDIT_LEVEL }}

      - name: Check allowlisted advisories
        run: |
          cat > npm-audit-allowlist.json << 'EOF'
          {
            "allowlist": []
          }
          EOF
          echo "Allowlist loaded. Add advisory IDs to npm-audit-allowlist.json as needed."

  cargo-audit:
    name: Cargo audit (Rust dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings
        continue-on-error: false

      - name: Check allowlisted advisories
        run: |
          mkdir -p .cargo
          if [ ! -f .cargo/audit-allowlist.toml ]; then
            cat > .cargo/audit-allowlist.toml << 'EOF'
            [advisories]
            ignore = []
            EOF
          fi
          echo "Allowlist at .cargo/audit-allowlist.toml"

  secret-scanning:
    name: Gitleaks — secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: false
        env:
          GITLEAKS_SEVERITY: ${{ env.SECRET_SCAN_SEVERITY }}

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1b549b925b9da1cb5ddde3b41741a82a2d15a841 # v3.28.13
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  trivy-image:
    name: Trivy — container image scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend image
        run: docker build -t brain-storm-backend:ci apps/backend

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe8 # v0.28.0
        with:
          image-ref: brain-storm-backend:ci
          format: sarif
          output: trivy-image.sarif
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1b549b925b9da1cb5ddde3b41741a82a2d15a841 # v3.28.13
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  grype-image:
    name: Grype — container image scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend image
        run: docker build -t brain-storm-backend:ci apps/backend

      - name: Run Grype image scan
        uses: anchore/scan-action@7c751f3cdaf3f3285b7c4abb77a9f82d0b22e1de # v6.1.0
        with:
          image: brain-storm-backend:ci
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1b549b925b9da1cb5ddde3b41741a82a2d15a841 # v3.28.13
        with:
          sarif_file: results.sarif
          category: grype-image

  trivy-fs:
    name: Trivy — filesystem / dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe8 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy fs SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1b549b925b9da1cb5ddde3b41741a82a2d15a841 # v3.28.13
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend image
        run: docker build -t brain-storm-backend:ci apps/backend

      - name: Generate image SBOM (Syft)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          image: brain-storm-backend:ci
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          artifact-name: sbom-image.cdx.json

      - name: Generate source SBOM (Syft)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json
          artifact-name: sbom-source.spdx.json

      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sboms
          path: |
            sbom-image.cdx.json
            sbom-source.spdx.json
          retention-days: 90

  security-report:
    name: Consolidated security report
    runs-on: ubuntu-latest
    needs: [npm-audit, cargo-audit, secret-scanning, trivy-image, grype-image, trivy-fs]
    if: always()
    steps:
      - name: Generate remediation report
        run: |
          cat > security-remediation.md << 'EOF'
          # Security Scan Remediation Guide

          ## Dependency Vulnerabilities
          - **npm audit failures**: Run `npm audit fix` or `npm update <package>` to patch
          - **cargo audit failures**: Run `cargo update` or patch via advisory recommendations
          - **Trivy/Grype findings**: Rebuild container images with updated base images

          ## Secret Scanning
          - **Gitleaks findings**: Remove secrets from git history using `git filter-branch` or BFG
          - **Rotate any leaked credentials immediately**
          - **Add false-positive paths to `.gitleaks.toml` allowlist**

          ## Severity Thresholds
          | Scanner | Fail Threshold | Allowlist Location |
          |---------|---------------|-------------------|
          | npm audit | High | npm-audit-allowlist.json |
          | cargo audit | Warnings | .cargo/audit-allowlist.toml |
          | Gitleaks | High | .gitleaks.toml |
          | Trivy | HIGH/CRITICAL | .trivyignore |
          | Grype | High | N/A |

          ## Remediation SLA
          - **CRITICAL**: Fix within 24 hours
          - **HIGH**: Fix within 7 days
          - **MEDIUM**: Fix within 30 days
          - **LOW**: Track and remediate opportunistically
          EOF

      - name: Upload remediation guide
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: security-remediation-guide
          path: security-remediation.md
          retention-days: 90
